# GStreamer prebuilt version pinned here so staging tasks and the runtime extractor
# always agree on the same version. Update when a new release is available on
# https://gstreamer.freedesktop.org/data/pkg/  (1.28.1 was released but not yet
# uploaded to the freedesktop CDN as of 2026-03-01; use latest available 1.26.x).
gstreamerVersion=1.26.4

# libheif prebuilt version — used by the staging script and runtime extractor.
# https://github.com/strukturag/libheif/releases
libheifVersion=1.21.2

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
kotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=512m

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Explicit source set dependencies are configured in modules; keep the legacy hierarchy setup.
kotlin.mpp.applyDefaultHierarchyTemplate=false
