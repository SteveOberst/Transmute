name: Android

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'transmute-api/**'
      - 'transmute-codec/**'
      - 'transmute-common/**'
      - 'transmute-filesystem/**'
      - 'transmute-model/**'
      - 'transmute-audio/**'
      - 'transmute-image/**'
      - 'transmute-video/**'
      - 'transmute-testing/**'
      - 'transmute-plugins/gstreamer/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download GStreamer Android SDK
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:downloadGStreamerAndroid
          -Pkotlin.native.enabled=false
        continue-on-error: true

      - name: Set GSTREAMER_ROOT_ANDROID
        run: |
          GST_DIR="${{ github.workspace }}/build/gstreamer-sdk/android"
          if [ -d "$GST_DIR" ]; then
            echo "GSTREAMER_ROOT_ANDROID=$GST_DIR" >> $GITHUB_ENV
          fi

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: >
            ./gradlew --no-daemon
            :transmute-audio:connectedDebugAndroidTest
            :transmute-image:connectedDebugAndroidTest
            :transmute-video:connectedDebugAndroidTest
            :transmute-plugins:gstreamer:connectedDebugAndroidTest
            -Pkotlin.native.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
