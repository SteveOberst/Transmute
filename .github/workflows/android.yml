name: Android

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'transmute-api/**'
      - 'transmute-codec/**'
      - 'transmute-common/**'
      - 'transmute-filesystem/**'
      - 'transmute-model/**'
      - 'transmute-audio/**'
      - 'transmute-image/**'
      - 'transmute-video/**'
      - 'transmute-testing/**'
      - 'transmute-plugins/gstreamer/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 75
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "/dev/kvm not present; android-emulator-runner will fall back automatically."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare Android workspace
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$HOME/.android"
          rm -rf "$HOME/.android/avd"
          ln -s "$ANDROID_AVD_HOME" "$HOME/.android/avd"
          df -h

      - name: Download GStreamer Android SDK
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:downloadGStreamerAndroid
          -Pkotlin.native.enabled=false
        continue-on-error: true

      - name: Set GSTREAMER_ROOT_ANDROID
        run: |
          GST_DIR="${{ github.workspace }}/build/gstreamer-sdk/android"
          if [ -d "$GST_DIR" ]; then
            echo "GSTREAMER_ROOT_ANDROID=$GST_DIR" >> $GITHUB_ENV
          fi

      - name: Run Android instrumented tests
        shell: bash
        run: |
          set -euo pipefail

          log() {
            printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"
          }

          log 'Accepting Android SDK licenses'
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          log 'Installing Android SDK packages'
          sdkmanager --install 'build-tools;36.0.0' platform-tools 'platforms;android-31' 'system-images;android-31;default;x86_64' emulator > /dev/null

          AVD_NAME=test
          AVD_DIR="$HOME/.android/avd/${AVD_NAME}.avd"
          EMULATOR_LOG="$RUNNER_TEMP/android-emulator.log"

          dump_emulator_log() {
            if [ -f "$EMULATOR_LOG" ]; then
              echo '::group::Android emulator log tail'
              tail -n 200 "$EMULATOR_LOG" || true
              echo '::endgroup::'
            fi
          }

          dump_device_state() {
            echo '::group::Android device state'
            adb devices -l || true
            adb -s emulator-5554 shell getprop sys.boot_completed || true
            adb -s emulator-5554 shell service check package || true
            adb -s emulator-5554 shell getprop init.svc.bootanim || true
            echo '::endgroup::'
          }

          rm -rf "$AVD_DIR"
          log 'Creating Android test AVD'
          echo no | avdmanager create avd --force -n "$AVD_NAME" --package 'system-images;android-31;default;x86_64'
          printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=4096M\n' >> "$AVD_DIR/config.ini"

          cleanup() {
            local status=$?
            if [ "${status}" -ne 0 ]; then
              log "Android instrumented test step failed with status ${status}"
              dump_device_state
              dump_emulator_log
            fi
            if [ -n "${EMULATOR_TAIL_PID:-}" ]; then
              kill "$EMULATOR_TAIL_PID" >/dev/null 2>&1 || true
              wait "$EMULATOR_TAIL_PID" >/dev/null 2>&1 || true
            fi
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            if [ -n "${EMULATOR_PID:-}" ]; then
              wait "$EMULATOR_PID" >/dev/null 2>&1 || true
            fi
            return "$status"
          }
          trap cleanup EXIT

          EMULATOR_ARGS=(
            -port 5554
            -avd "$AVD_NAME"
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
          )

          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            log 'KVM not accessible; forcing software acceleration'
            EMULATOR_ARGS+=( -accel off )
          else
            log 'KVM accessible; using hardware acceleration'
          fi

          : > "$EMULATOR_LOG"
          log 'Launching emulator'
          emulator "${EMULATOR_ARGS[@]}" > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          tail -n +1 -F "$EMULATOR_LOG" 2>/dev/null | sed -u 's/^/[emulator] /' &
          EMULATOR_TAIL_PID=$!

          log 'Waiting for adb device'
          adb wait-for-device
          adb devices -l || true

          until boot_completed="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" && [ "$boot_completed" = '1' ]; do
            log "Waiting for sys.boot_completed... current='${boot_completed:-}'"
            sleep 5
          done
          log 'sys.boot_completed=1'

          adb -s emulator-5554 shell input keyevent 82 >/dev/null 2>&1 || true

          until package_service="$(adb -s emulator-5554 shell service check package 2>/dev/null | tr -d '\r')" && echo "$package_service" | grep -q 'Service package: found'; do
            log "Waiting for package manager service... current='${package_service:-}'"
            sleep 5
          done
          log 'Package manager service is available'

          until adb -s emulator-5554 shell cmd package path android >/dev/null 2>&1; do
            log 'Waiting for package manager commands...'
            sleep 5
          done
          log 'Package manager commands are available'

          adb -s emulator-5554 shell settings put global window_animation_scale 0.0 >/dev/null 2>&1 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0.0 >/dev/null 2>&1 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0.0 >/dev/null 2>&1 || true

          log 'Running Android connected tests'
          ./gradlew --no-daemon \
            :transmute-audio:connectedDebugAndroidTest \
            :transmute-image:connectedDebugAndroidTest \
            :transmute-video:connectedDebugAndroidTest \
            :transmute-plugins:gstreamer:connectedDebugAndroidTest \
            -Pkotlin.native.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-reports-${{ github.run_id }}
          path: |
            **/build/reports/androidTests/**
            **/build/reports/tests/**
          retention-days: 7
