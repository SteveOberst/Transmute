name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'transmute-api/**'
      - 'transmute-codec/**'
      - 'transmute-common/**'
      - 'transmute-filesystem/**'
      - 'transmute-model/**'
      - 'transmute-audio/**'
      - 'transmute-image/**'
      - 'transmute-video/**'
      - 'transmute-structure/**'
      - 'transmute-testing/**'
      - 'transmute-plugins/catalog/**'
      - 'transmute-plugins/gstreamer/**'
      - 'transmute-plugins/libheif/**'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run common unit tests (desktop target)
        run: >
          ./gradlew --no-daemon
          :transmute-api:desktopTest
          :transmute-audio:desktopTest
          :transmute-codec:desktopTest
          :transmute-image:desktopTest
          :transmute-model:structure:desktopTest
          :transmute-filesystem:core:desktopTest
          :transmute-filesystem:okio:desktopTest
          -Pkotlin.native.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-unit-test-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install desktop media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-base-apps \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libheif-examples \
            libheif-dev \
            libheif-plugin-aomenc \
            libheif-plugin-aomdec \
            libheif-plugin-libde265 \
            libheif-plugin-x265

      - name: Verify desktop media dependencies
        run: |
          gst-inspect-1.0 --version
          heif-enc --version

      - name: Run desktop integration tests
        run: >
          ./gradlew --no-daemon
          :transmute-api:desktopIntegrationTest
          :transmute-audio:desktopIntegrationTest
          :transmute-image:desktopIntegrationTest
          :transmute-plugins:gstreamer:desktopIntegrationTest
          :transmute-plugins:libheif:desktopIntegrationTest
          -Pkotlin.native.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
