name: "Integration: Desktop"

on:
  pull_request:
    branches: [main]

concurrency:
  group: integration-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop Integration Tests (JVM)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install GStreamer
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          gstreamer1.0-tools
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly

      - name: Run desktop integration tests
        run: >
          ./gradlew --no-daemon
          :transmute-audio:desktopTest
          :transmute-image:desktopTest
          :transmute-video:desktopTest
          :transmute-gstreamer:desktopTest
          -Pkotlin.native.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
