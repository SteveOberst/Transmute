name: Integration Tests

on:
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_call: # allow reuse from release.yml
  workflow_dispatch: # allow manual trigger

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Android Emulator Tests (Linux)
  # ──────────────────────────────────────────────
  android-tests:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (Linux)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ runner.os }}

      - name: Create AVD and cache snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Use a file to track failures — shell variables do not
            # persist across the line-by-line execution that some
            # versions of android-emulator-runner use.
            echo "pass" > /tmp/test_status

            echo "=== Image tests ==="
            ./gradlew :transmute-image:connectedAndroidTest --stacktrace || echo "fail" > /tmp/test_status
            echo "=== Image tests done ==="

            echo "=== Audio tests ==="
            ./gradlew :transmute-audio:connectedAndroidTest --stacktrace || echo "fail" > /tmp/test_status
            echo "=== Audio tests done ==="

            echo "=== Video tests ==="
            ./gradlew :transmute-video:connectedAndroidTest --stacktrace || echo "fail" > /tmp/test_status
            echo "=== Video tests done ==="

            echo "=== Logcat (test output) ==="
            adb logcat -d -s "System.out" | grep ">>>" || true

            test "$(cat /tmp/test_status)" = "pass"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
          retention-days: 14

  # ──────────────────────────────────────────────
  # iOS Simulator Tests (macOS)
  # ──────────────────────────────────────────────
  ios-tests:
    name: iOS Simulator Tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: >-
          ./gradlew
          :transmute-core:iosSimulatorArm64Test
          :transmute-image:iosSimulatorArm64Test
          :transmute-audio:iosSimulatorArm64Test
          :transmute-video:iosSimulatorArm64Test

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            **/build/reports/tests/iosSimulatorArm64Test/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Desktop Tests (macOS - also covers FFmpeg)
  # ──────────────────────────────────────────────
  desktop-tests:
    name: Desktop Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Run desktop tests
        run: ./gradlew desktopTest

      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: |
            **/build/reports/tests/desktopTest/
          retention-days: 14
