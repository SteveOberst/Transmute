name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (JVM + Desktop)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Run JVM/desktop unit tests
        run: ./gradlew --no-daemon desktopTest -Pkotlin.native.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
