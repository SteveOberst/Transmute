name: CI - Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # allow reuse from release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (JVM + Common)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Compile all modules (JVM + Android targets only)
        run: ./gradlew --no-daemon build -x test -x check -Pkotlin.native.enabled=false

      - name: Run JVM/desktop unit tests
        run: ./gradlew --no-daemon desktopTest -Pkotlin.native.enabled=false
