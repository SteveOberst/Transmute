name: CI - Unit Tests

on:
  push:
    branches:
      - main
      - 'release-please--branches--**'
  pull_request:
    branches: [main]
  workflow_call: # allow reuse from release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (JVM + Common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile all modules
        run: ./gradlew build -x test -x check

      - name: Run common + desktop tests
        run: ./gradlew desktopTest
