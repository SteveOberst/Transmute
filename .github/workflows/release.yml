name: Release

on:
  push:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    name: Publish to GitHub Packages
    if: github.event_name == 'release'
    runs-on: [self-hosted, linux, x64]
    env:
      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (tests already gated on the release PR)
        run: ./gradlew --no-daemon build -x test -x check -Pkotlin.native.enabled=false

      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon publish -Pkotlin.native.enabled=false

      - name: Upload JARs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transmute-core/build/libs/*.jar
            transmute-audio/build/libs/*.jar
            transmute-image/build/libs/*.jar
            transmute-video/build/libs/*.jar
