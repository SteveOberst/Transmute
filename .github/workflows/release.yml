name: Release

on:
  push:
    branches: [main]
  release:
    types: [created]

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # ---------------------------------------------------------------------------
  # Stage GStreamer desktop binaries for bundling into the desktop JAR.
  # Runs on the two platforms that ship portable GStreamer binaries.
  # The staged files are uploaded as artifacts and merged by the publish job.
  # ---------------------------------------------------------------------------
  stage-gstreamer-desktop:
    name: Stage GStreamer Desktop (${{ matrix.os }})
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cache the staged output keyed by GStreamer version + OS so re-runs and
      # future releases of the same GStreamer version skip the download.
      - name: Restore GStreamer staging cache
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/
          key: gstreamer-desktop-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Stage GStreamer desktop binaries
        if: steps.gst-cache.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon :transmute-plugins:gstreamer:stageGStreamerDesktop

      - name: Upload staged binaries
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-desktop-${{ runner.os }}
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/
          include-hidden-files: true
          if-no-files-found: error
          # Retention only needs to outlive this workflow run
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Stage libheif desktop binaries for bundling into the libheif desktop JAR.
  # Windows uses vcpkg; macOS uses Homebrew. Linux relies on system packages
  # and does not bundle binaries into the JAR.
  # ---------------------------------------------------------------------------
  stage-libheif-desktop:
    name: Stage libheif Desktop (${{ matrix.os }})
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore libheif staging cache
        id: libheif-cache
        uses: actions/cache@v4
        with:
          path: transmute-plugins/libheif/build/libheif-desktop/
          key: libheif-desktop-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Set up MSYS2 libheif on Windows
        id: msys2-libheif
        if: runner.os == 'Windows' && steps.libheif-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-libheif

      - name: Install libheif on macOS
        if: runner.os == 'macOS' && steps.libheif-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew list libheif >/dev/null 2>&1 || brew install libheif

      - name: Stage libheif desktop binaries
        if: steps.libheif-cache.outputs.cache-hit != 'true'
        env:
          TRANSMUTE_LIBHEIF_WINDOWS_HOME: ${{ steps.msys2-libheif.outputs.msys2-location }}\mingw64
        run: ./gradlew --no-daemon :transmute-plugins:libheif:stageLibHeifDesktop

      - name: Upload staged libheif binaries
        uses: actions/upload-artifact@v4
        with:
          name: libheif-desktop-${{ runner.os }}
          path: transmute-plugins/libheif/build/libheif-desktop/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GitHub Packages
    if: github.event_name == 'release'
    needs: [stage-gstreamer-desktop, stage-libheif-desktop]
    # Publish from macOS so the iOS Kotlin/Native publications are produced
    # alongside the Android, Desktop/JVM, and KMP metadata publications.
    # The Linux self-hosted runner cannot link the iOS frameworks; switching
    # to a GitHub-hosted macOS runner keeps the published artifact set in
    # sync with the public README's platform claims (B-2).
    runs-on: macos-15
    env:
      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Download both platform artifacts into the same destination - they contain
      # non-overlapping platform subdirectories so they merge cleanly.
      - name: Download staged GStreamer binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-desktop-Windows
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/

      - name: Download staged GStreamer binaries (macOS)
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-desktop-macOS
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/

      - name: Download staged libheif binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: libheif-desktop-Windows
          path: transmute-plugins/libheif/build/libheif-desktop/

      - name: Download staged libheif binaries (macOS)
        uses: actions/download-artifact@v4
        with:
          name: libheif-desktop-macOS
          path: transmute-plugins/libheif/build/libheif-desktop/

      # Required for the iOS Kotlin/Native compilation of :transmute-plugins:gstreamer.
      # Cached by the SDK gradle task; safe to run unconditionally.
      - name: Download GStreamer iOS SDK
        run: ./gradlew --no-daemon :transmute-plugins:gstreamer:downloadGStreamerIos

      - name: Build (tests already gated on the release PR)
        run: ./gradlew --no-daemon build -x test -x check

      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon publish

      - name: Upload JARs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transmute-api/build/libs/*.jar
            transmute-audio/build/libs/*.jar
            transmute-image/build/libs/*.jar
            transmute-video/build/libs/*.jar
            transmute-plugins/gstreamer/build/libs/*.jar
            transmute-plugins/libheif/build/libs/*.jar
