name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Dispatch CI & integration checks on the release-please PR branch.
  # GITHUB_TOKEN suppresses push/pull_request events but NOT workflow_dispatch,
  # so we use `gh workflow run` to trigger the test workflows on the PR branch.
  # We first merge main into the PR branch so the workflow files are current.
  trigger-pr-checks:
    needs: release-please
    if: ${{ !needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI & integration on release-please PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_BRANCH=$(gh pr list --state open --json headRefName \
            -q '.[].headRefName' | grep '^release-please--branches--' | head -1)

          if [ -z "$PR_BRANCH" ]; then
            echo "No release-please PR open, skipping."
            exit 0
          fi

          PR_NUMBER=$(gh pr list --state open --head "$PR_BRANCH" \
            --json number -q '.[0].number')

          echo "Found PR #$PR_NUMBER on branch $PR_BRANCH"

          # Merge latest main into the PR branch so workflow files are current
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/update-branch" \
            --method PUT --field update_method=merge 2>&1 \
            || echo "Branch already up to date"

          sleep 5

          echo "Dispatching CI on $PR_BRANCH"
          gh workflow run ci.yml --ref "$PR_BRANCH"
          echo "Dispatching Integration Tests on $PR_BRANCH"
          gh workflow run integration.yml --ref "$PR_BRANCH"

  # Gate on CI unit tests passing
  ci-gate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/ci.yml

  # Run integration tests before publishing
  integration-gate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [release-please, ci-gate, integration-gate]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            transmute-core/build/libs/*.jar
            transmute-audio/build/libs/*.jar
            transmute-image/build/libs/*.jar
            transmute-video/build/libs/*.jar
