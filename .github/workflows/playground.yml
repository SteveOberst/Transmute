name: Playground CI

on:
  push:
    branches: [main]
    paths:
      - 'transmute-playground/**'
  pull_request:
    paths:
      - 'transmute-playground/**'

jobs:
  build-frontend:
    name: Build Next.js Frontend
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: transmute-playground/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: transmute-playground/web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: transmute-playground/web/out/
          retention-days: 7

  build-server:
    name: Build Ktor Server
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build server shadow JAR
        run: ./gradlew :transmute-playground:server:shadowJar --no-daemon

  docker:
    name: Docker Build
    runs-on: [self-hosted, linux, x64]
    needs: [build-frontend, build-server]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: |
          export BUILDAH_ISOLATION=chroot
          buildah bud \
            --format docker \
            -f transmute-playground/Dockerfile \
            -t transmute-playground:${{ github.sha }} \
            .
