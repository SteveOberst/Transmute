name: "Integration: iOS"

# Disabled — manual trigger only until we have a stable macOS runner budget.
# To enable on PRs, uncomment the pull_request trigger below.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]

concurrency:
  group: integration-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    name: iOS Simulator Tests (arm64)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download GStreamer iOS SDK
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:downloadGStreamerIos
        continue-on-error: true

      - name: Run iOS simulator tests
        run: >
          ./gradlew --no-daemon
          :transmute-audio:iosSimulatorArm64Test
          :transmute-image:iosSimulatorArm64Test
          :transmute-video:iosSimulatorArm64Test
          :transmute-plugins:gstreamer:iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
