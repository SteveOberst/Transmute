name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'transmute-api/**'
      - 'transmute-codec/**'
      - 'transmute-common/**'
      - 'transmute-filesystem/**'
      - 'transmute-model/**'
      - 'transmute-audio/**'
      - 'transmute-image/**'
      - 'transmute-video/**'
      - 'transmute-testing/**'
      - 'transmute-plugins/catalog/**'
      - 'transmute-plugins/gstreamer/**'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect GStreamer-impacting changes
    runs-on: ubuntu-latest
    outputs:
      gstreamer: ${{ steps.filter.outputs.gstreamer }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gstreamer:
              - '.github/workflows/ios.yml'
              - 'build.gradle.kts'
              - 'buildSrc/**'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'transmute-api/**'
              - 'transmute-codec/**'
              - 'transmute-common/**'
              - 'transmute-filesystem/**'
              - 'transmute-audio/**'
              - 'transmute-image/**'
              - 'transmute-video/**'
              - 'transmute-testing/**'
              - 'transmute-plugins/catalog/**'
              - 'transmute-plugins/gstreamer/**'

  integration-tests:
    name: Integration Tests (Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: >
          ./gradlew --no-daemon
          :transmute-audio:iosSimulatorArm64Test
          :transmute-image:iosSimulatorArm64Test
          :transmute-video:iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7

  gstreamer-integration-tests:
    name: Integration Tests (GStreamer Simulator)
    needs: changes
    if: needs.changes.outputs.gstreamer == 'true'
    # GStreamer iOS framework only ships an x86_64 simulator slice, so this
    # job has to run on an Intel macOS runner.
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore GStreamer iOS SDK cache
        id: gst-ios-cache
        uses: actions/cache@v4
        with:
          path: build/gstreamer-sdk/ios/
          key: gstreamer-ios-${{ runner.os }}-${{ hashFiles('gradle.properties', 'transmute-plugins/gstreamer/gstreamer-sdk.gradle.kts') }}

      - name: Download GStreamer iOS SDK
        if: steps.gst-ios-cache.outputs.cache-hit != 'true'
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:downloadGStreamerIos
        continue-on-error: true

      - name: Run GStreamer iOS simulator tests
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:iosX64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-gstreamer-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
