name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'transmute-api/**'
      - 'transmute-codec/**'
      - 'transmute-common/**'
      - 'transmute-filesystem/**'
      - 'transmute-model/**'
      - 'transmute-audio/**'
      - 'transmute-image/**'
      - 'transmute-video/**'
      - 'transmute-testing/**'
      - 'transmute-plugins/gstreamer/**'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests (Simulator)
    # WarpBuild M4 Pro macOS ARM64 (6 vCPU, 22GB RAM, 120GB SSD). Drop-in for
    # GitHub-hosted macos-15 (also ARM64) and runs iosSimulatorArm64Test.
    runs-on: warp-macos-latest-arm64-6x
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download GStreamer iOS SDK
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:downloadGStreamerIos
        continue-on-error: true

      - name: Run iOS simulator tests
        run: >
          ./gradlew --no-daemon
          :transmute-audio:iosSimulatorArm64Test
          :transmute-image:iosSimulatorArm64Test
          :transmute-video:iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7

  gstreamer-integration-tests:
    name: Integration Tests (GStreamer Simulator)
    # GStreamer iOS framework tests target iosX64 (Intel simulator). WarpBuild
    # only offers ARM64 macOS, so this job stays on GitHub-hosted macos-15-intel.
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Download GStreamer iOS SDK
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:downloadGStreamerIos
        continue-on-error: true

      - name: Run GStreamer iOS simulator tests
        run: >
          ./gradlew --no-daemon
          :transmute-plugins:gstreamer:iosX64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-gstreamer-integration-reports-${{ github.run_id }}
          path: '**/build/reports/tests/'
          retention-days: 7
