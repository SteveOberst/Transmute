name: Pre-release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from (branch, tag, or SHA)
        required: true
        default: main
      version:
        description: Pre-release version to publish (for example 0.5.0-beta.1)
        required: true

concurrency:
  group: prerelease-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Validate pre-release version format
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "Version must be a semantic pre-release like 0.5.0-beta.1"
            exit 1
          fi

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists"
            exit 1
          fi

  stage-gstreamer-desktop:
    name: Stage GStreamer Desktop (${{ matrix.os }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore GStreamer staging cache
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/
          key: gstreamer-desktop-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Stage GStreamer desktop binaries
        if: steps.gst-cache.outputs.cache-hit != 'true'
        env:
          TRANSMUTE_VERSION: ${{ inputs.version }}
        run: ./gradlew --no-daemon :transmute-plugins:gstreamer:stageGStreamerDesktop

      - name: Upload staged binaries
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-desktop-${{ runner.os }}
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/
          if-no-files-found: error
          retention-days: 1

  stage-libheif-desktop:
    name: Stage libheif Desktop (${{ matrix.os }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore libheif staging cache
        id: libheif-cache
        uses: actions/cache@v4
        with:
          path: transmute-plugins/libheif/build/libheif-desktop/
          key: libheif-desktop-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Set up MSYS2 libheif on Windows
        id: msys2-libheif
        if: runner.os == 'Windows' && steps.libheif-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-libheif

      - name: Install libheif on macOS
        if: runner.os == 'macOS' && steps.libheif-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew list libheif >/dev/null 2>&1 || brew install libheif

      - name: Stage libheif desktop binaries
        if: steps.libheif-cache.outputs.cache-hit != 'true'
        env:
          TRANSMUTE_VERSION: ${{ inputs.version }}
          TRANSMUTE_LIBHEIF_WINDOWS_HOME: ${{ steps.msys2-libheif.outputs.msys2-location }}\mingw64
        run: ./gradlew --no-daemon :transmute-plugins:libheif:stageLibHeifDesktop

      - name: Upload staged libheif binaries
        uses: actions/upload-artifact@v4
        with:
          name: libheif-desktop-${{ runner.os }}
          path: transmute-plugins/libheif/build/libheif-desktop/
          if-no-files-found: error
          retention-days: 1

  publish-prerelease:
    name: Publish Pre-release (macOS)
    needs: [stage-gstreamer-desktop, stage-libheif-desktop]
    runs-on: macos-15
    env:
      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRANSMUTE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download staged GStreamer binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-desktop-Windows
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/

      - name: Download staged GStreamer binaries (macOS)
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-desktop-macOS
          path: transmute-plugins/gstreamer/build/gstreamer-desktop/

      - name: Download staged libheif binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: libheif-desktop-Windows
          path: transmute-plugins/libheif/build/libheif-desktop/

      - name: Download staged libheif binaries (macOS)
        uses: actions/download-artifact@v4
        with:
          name: libheif-desktop-macOS
          path: transmute-plugins/libheif/build/libheif-desktop/

      - name: Download GStreamer iOS SDK
        run: ./gradlew --no-daemon :transmute-plugins:gstreamer:downloadGStreamerIos

      - name: Build (tests already gated before publish)
        run: ./gradlew --no-daemon build -x test -x check

      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon publish

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          target_commitish: ${{ inputs.ref }}
          prerelease: true
          generate_release_notes: true
          files: |
            transmute-api/build/libs/*.jar
            transmute-audio/build/libs/*.jar
            transmute-image/build/libs/*.jar
            transmute-video/build/libs/*.jar
            transmute-plugins/gstreamer/build/libs/*.jar
            transmute-plugins/libheif/build/libs/*.jar
